<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f7" />
    <meta name="description" content="A free, minimalist Bible reader. Offline-first, no account." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Open Bible" />
    <link rel="icon" type="image/svg+xml" href="/open-bible/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/open-bible/icons/apple-touch-icon.png" />
    <title>Open Bible</title>
    <script>
      // Aplica o tema antes do primeiro paint para evitar flash.
      try {
        var s = JSON.parse(localStorage.getItem('ob:settings') || '{}');
        var t = s.theme || 'auto';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
