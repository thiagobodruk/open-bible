<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f7" />
    <meta name="description" content="A free, minimalist Bible reader. Offline-first, no account." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open Bible" />
    <meta property="og:title" content="Open Bible" />
    <meta property="og:description" content="A free, minimalist Bible reader. Offline-first, no account." />
    <meta property="og:url" content="https://thiagobodruk.github.io/open-bible/" />
    <meta property="og:image" content="https://thiagobodruk.github.io/open-bible/og-thumb.png" />
    <meta property="og:image:width" content="192" />
    <meta property="og:image:height" content="192" />
    <meta property="og:image:alt" content="Open Bible logo: an open book with a cross" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Open Bible" />
    <meta name="twitter:description" content="A free, minimalist Bible reader. Offline-first, no account." />
    <meta name="twitter:image" content="https://thiagobodruk.github.io/open-bible/og-thumb.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Open Bible" />
    <link rel="icon" type="image/png" sizes="64x64" href="/open-bible/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/open-bible/icons/apple-touch-icon.png" />
    <title>Open Bible</title>
    <script>
      // Aplica o tema antes do primeiro paint para evitar flash.
      try {
        var s = JSON.parse(localStorage.getItem('ob:settings') || '{}');
        var t = s.theme || 'auto';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
      // No Android o PWA instalado já mostra a splash do sistema, então a nossa fica de fora.
      if (/Android/i.test(navigator.userAgent) && matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('no-splash');
    </script>
    <style>
      /* Splash: vive no HTML para aparecer antes de o JavaScript carregar. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: #1d2027; background: #faf9f7; transition: opacity 0.3s ease; }
      :root[data-theme='sepia'] #splash { background: #f3ead8; color: #3a2f22; }
      :root[data-theme='dark'] #splash { background: #14161b; color: #e4e6eb; }
      #splash small { position: absolute; left: 0; right: 0; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); text-align: center; font: 500 13px/1 'Inter Variable', system-ui, -apple-system, 'Segoe UI', sans-serif; opacity: 0.35; }
      #splash span { font: 700 26px/1 'Inter Variable', system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -0.01em; }
      .no-splash #splash { display: none; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: 96px; height: 96px; }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/open-bible/icons/icon-192.png" alt="" width="96" height="96" /><span>Open Bible</span><small>v%APP_VERSION%</small></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
