<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f7" />
    <meta name="description" content="A free, minimalist Bible reader. Offline-first, no account." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Open Bible" />
    <link rel="icon" type="image/png" sizes="64x64" href="/open-bible/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/open-bible/icons/apple-touch-icon.png" />
    <title>Open Bible</title>
    <script>
      // Aplica o tema antes do primeiro paint para evitar flash.
      try {
        var s = JSON.parse(localStorage.getItem('ob:settings') || '{}');
        var t = s.theme || 'auto';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      /* Splash: vive no HTML para aparecer antes de o JavaScript carregar. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #faf9f7; transition: opacity 0.3s ease; }
      :root[data-theme='sepia'] #splash { background: #f3ead8; }
      :root[data-theme='dark'] #splash { background: #14161b; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: 96px; height: 96px; animation: splash-pulse 1.6s ease-in-out infinite; }
      @keyframes splash-pulse { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.06); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } #splash { transition: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/open-bible/icons/icon-192.png" alt="" width="96" height="96" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
