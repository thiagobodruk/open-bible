name = "open-bible-ai"
main = "src/index.js"
compatibility_date = "2025-01-01"

[observability]
enabled = true

[vars]
# Comma-separated list of sites allowed to call the Worker from a browser.
ALLOWED_ORIGINS = "https://thiagobodruk.github.io"
# Any chat model your AI service lists. A larger model answers better and costs more.
MODEL = "openai/gpt-oss-20b"
# Chat completions endpoint of an OpenAI-compatible service. Leave unset to use the default one.
# API_URL = "https://your-provider.example/v1/chat/completions"
# Questions per IP per day. Only applies when the DAILY namespace below is set up.
DAILY_LIMIT = "30"
# A hard cap on the answer, including the short thinking the model does first. The prompt asks for 1 to 3 short paragraphs.
MAX_TOKENS = "700"

# Per-IP rate limit. Remove this block to run without it.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

# Optional daily limit per IP. Create the namespace with `npx wrangler kv namespace create DAILY`,
# then uncomment this block and paste the id it prints.
# [[kv_namespaces]]
# binding = "DAILY"
# id = "PASTE_THE_ID_HERE"
