name = "open-bible-ai"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of sites allowed to call the Worker from a browser.
ALLOWED_ORIGINS = "https://thiagobodruk.github.io"
MODEL = "llama-3.3-70b-versatile"
MAX_TOKENS = "700"

# Per-IP rate limit. Remove this block to run without it.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
