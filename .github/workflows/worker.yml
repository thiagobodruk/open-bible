name: Deploy the AI Worker

# Publishes worker/ to Cloudflare when it changes on main, and can be run by hand from the Actions tab.
# Needs the repository secret CLOUDFLARE_API_TOKEN (see the README). Without it the job only prints a warning.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Optional: only needed when the token can reach more than one Cloudflare account.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        working-directory: worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the Worker was not deployed. Add it under Settings > Secrets and variables > Actions, then run this workflow again."
            exit 0
          fi
          npx --yes wrangler@4 deploy
